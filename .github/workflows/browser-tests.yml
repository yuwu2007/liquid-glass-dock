name: Browser refraction regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc -b --force
      - run: npm run build
      - run: npx playwright install --with-deps webkit chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refraction-test-results
          path: test-results/
          retention-days: 7
